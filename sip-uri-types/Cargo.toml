[package]
name = "sip-uri-types"
version = "1.0.0-rc.2"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "RFC 3261 SIP/SIPS, RFC 3966 tel: and RFC 8141 URN value types held in canonical form, parsed by sip-uri"
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/sip-uri-types"
readme = "README.md"
keywords = ["sip", "uri", "voip", "tel", "urn"]
categories = ["data-structures", "network-programming"]

[package.metadata.docs.rs]
all-features = true

[features]
serde = ["dep:serde"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
serde_json = "1"
