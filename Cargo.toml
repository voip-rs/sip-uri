[workspace]
members = ["sip-uri-types"]
default-members = [".", "sip-uri-types"]

[workspace.package]
edition = "2021"
rust-version = "1.70"
authors = ["Jérôme Poulin <jeromepoulin@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/voip-rs/sip-uri"

# serde_derive's proc-macro dependencies need a newer toolchain than the crates.
[workspace.metadata]
serde-rust-version = "1.71"

[package]
name = "sip-uri"
version = "0.3.0-rc.2"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Lenient RFC 3261 SIP/SIPS, RFC 3966 tel: and RFC 8141 URN parser that reports grammar breaches as typed warnings"
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/sip-uri"
readme = "README.md"
keywords = ["sip", "uri", "voip", "tel", "urn"]
categories = ["parser-implementations", "network-programming"]
exclude = ["CLAUDE.md", "hooks/", ".claude/", "scripts/"]

[package.metadata.docs.rs]
all-features = true

[features]
serde = ["dep:serde", "sip-uri-types/serde"]

[dependencies]
serde = { version = "1", optional = true }
sip-uri-types = { version = "1.0.0-rc.2", path = "sip-uri-types" }

[dev-dependencies]
clap = { version = "4", default-features = false, features = ["std", "help", "usage", "error-context", "derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release-min]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
